<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>인형 뽑기</title>
<style>
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#2a1630; color:#fff; touch-action:none;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  #stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; background:#000; }
  #game { display:block; touch-action:none; border-radius:8px; }
  #ctls { position:absolute; left:0; right:0; bottom:0; height:15%; z-index:5; display:flex; gap:10px; align-items:center; justify-content:center; padding:0 12px; background:linear-gradient(0deg,rgba(20,8,30,.95),rgba(20,8,30,.6)); border-radius:0 0 8px 8px; }
  #ctls.hidden { display:none; }
  #ctls button { height:80%; border-radius:18px; font-size:22px; font-weight:900; color:#fff; border:2px solid rgba(255,255,255,.4); background:rgba(255,255,255,.16); cursor:pointer; touch-action:none; }
  #ctls button.on { background:rgba(255,200,60,.5); transform:translateY(2px); }
  #btnL, #btnR { flex:1; }
  #btnDrop { flex:1.5; background:linear-gradient(180deg,#ff9fc4,#e0406f); border-color:#ffd0e0; box-shadow:0 4px 0 #8e1f45; font-size:18px; }
  #btnDrop:disabled { opacity:.4; }
  #btnDrop small { display:block; font-size:10px; font-weight:600; opacity:.85; }
  #top { position:absolute; right:6px; top:6px; display:flex; gap:6px; z-index:7; }
  #top button { position:relative; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.3); color:#fff; width:32px; height:32px; border-radius:8px; font-size:14px; cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-6px -3px; }
  #overlay { position:absolute; inset:0; z-index:6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:14px; background:rgba(24,8,34,.88); border-radius:8px; }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:42px; font-weight:900; color:#ff9fc4; text-shadow:0 3px 0 #7a1a3e; }
  #overlay h2 { font-size:26px; font-weight:900; }
  #overlay p { font-size:13px; color:#e6e6e6; line-height:1.6; }
  #overlay .big { font-size:34px; }
  #overlay .help { font-size:12px; color:#c9b8d6; line-height:1.7; }
  #overlay .note { font-size:11px; color:#b9a8c8; }
  #overlay button { margin-top:6px; background:linear-gradient(180deg,#ffd0e0,#ff6f9f); color:#4a0e26; font-weight:900; font-size:17px; border:none; border-radius:999px; padding:12px 34px; box-shadow:0 4px 0 #a02a58; cursor:pointer; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #a02a58; }
  #overlay .lv { display:flex; gap:10px; margin-top:6px; }
  #overlay .lv button { margin-top:0; padding:10px 18px; font-size:16px; }
  #overlay .lv small { display:block; font-size:10px; font-weight:600; opacity:.75; margin-top:2px; }
  .pc { display:inline; } .touch { display:none; }
  @media (pointer:coarse) { .pc { display:none; } .touch { display:inline; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game" width="360" height="640"></canvas>
    <div id="top"><button id="muteBtn" title="소리 (M)">🔊</button></div>
    <div id="ctls" class="hidden"><button id="btnL">◀</button><button id="btnDrop">뽑기!<small>Space</small></button><button id="btnR">▶</button></div>
    <div id="overlay"></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
